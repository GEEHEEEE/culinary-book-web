<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Кулинарная книга</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f4f4f4; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h1 { color: #333; }
        .search-bar { display: flex; gap: 10px; margin-bottom: 20px; }
        input, select, button { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #4CAF50; color: white; border: none; cursor: pointer; font-size: 16px; }
        ul { list-style-type: none; padding: 0; }
        li { background: #f9f9f9; margin-bottom: 5px; padding: 10px; border-radius: 4px; border-left: 4px solid #2196F3; }
        a { text-decoration: none; color: #2196F3; font-weight: bold; }
        .btn-shopping { display: inline-block; background: #ff9800; color: white; padding: 10px 15px; border-radius: 4px; margin-top: 15px; text-decoration: none; font-weight: bold;}
    </style>
</head>
<body>
    <div class="container">
        <h1>Мои рецепты</h1>
        
        <form method="GET" class="search-bar">
            <input type="text" name="search" placeholder="Поиск по названию..." value="{{ search }}" style="flex: 1;">
            <select name="category_id">
                <option value="">Все категории</option>
                {% for cat in categories %}
                <option value="{{ cat.id }}" {% if selected_cat == cat.id %}selected{% endif %}>{{ cat.name }}</option>
                {% endfor %}
            </select>
            <button type="submit" title="Искать">🔍</button>
        </form>

        <ul>
            {% for recipe in recipes %}
            <li>
                <a href="/recipe/{{ recipe.id }}">{{ recipe.title }}</a>
                <span style="color: #777; font-size: 0.9em;">({{ recipe.category_name or 'Без категории' }}, {{ recipe.default_servings }} порций)</span>
            </li>
            {% else %}
            <li>Рецептов не найдено.</li>
            {% endfor %}
        </ul>
        
        <a href="/shopping" class="btn-shopping">🛒 Перейти к списку покупок</a>
    </div>
</body>
</html>
